<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스터디 플래너</title>
  <link rel="manifest" href="data:application/manifest+json,&#123;%22name%22:%22스터디%20플래너%22,%22short_name%22:%22플래너%22,%22start_url%22:%22./%22,%22display%22:%22standalone%22,%22background_color%22:%22%23f8fafc%22,%22theme_color%22:%22%231e293b%22&#125;">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <h1 class="font-bold text-lg tracking-tight flex items-center gap-2">
        <span class="text-xl">📚</span> 스터디 플래너
      </h1>
      <button id="pwaInstallBtn" class="hidden text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-3 py-1.5 rounded-full transition">
        📲 앱 설치
      </button>
    </div>
    <!-- Navigation Tabs -->
    <nav class="flex border-t border-slate-800 bg-slate-900/95 backdrop-blur text-sm">
      <button onclick="switchTab('daily')" id="tab-daily" class="flex-1 py-3 text-center font-semibold border-b-2 border-indigo-400 text-indigo-400 transition">일간</button>
      <button onclick="switchTab('weekly')" id="tab-weekly" class="flex-1 py-3 text-center font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition">주간</button>
      <button onclick="switchTab('monthly')" id="tab-monthly" class="flex-1 py-3 text-center font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition">월간 (시험)</button>
      <button onclick="switchTab('subjects')" id="tab-subjects" class="flex-1 py-3 text-center font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition">과목/타이머</button>
    </nav>
  </header>

  <!-- Main View Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-4 md:p-6 pb-12 overflow-y-auto">

    <!-- DAILY VIEW -->
    <section id="view-daily" class="space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200/80 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <input type="date" id="daily-date" onchange="loadDailyView()" class="bg-slate-100 font-bold text-slate-800 px-3 py-1.5 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <span id="daily-day-name" class="font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md text-sm border border-indigo-100"></span>
        </div>
        <div class="flex-1 min-w-[240px]">
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded shrink-0">🎯 주간 연동 목표</span>
            <input type="text" id="daily-target" placeholder="오늘 이룰 목표를 적으세요..." oninput="saveDailyTarget()" class="w-full text-sm font-medium border-b border-slate-300 focus:border-indigo-500 focus:outline-none py-1 bg-transparent">
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
        <!-- Time Table -->
        <div class="lg:col-span-5 bg-white p-4 rounded-xl shadow-sm border border-slate-200/80">
          <h3 class="font-bold text-slate-800 text-sm mb-3 flex items-center justify-between">
            <span class="flex items-center gap-1.5">🕒 시간표 (06:00 ~ 00:00)</span>
            <span class="text-[11px] font-normal text-slate-500">🔁 체크 시 매주 요일 반복</span>
          </h3>
          <div id="timetable-list" class="space-y-1.5 max-h-[500px] overflow-y-auto pr-1"></div>
        </div>

        <!-- To-Do & Notes -->
        <div class="lg:col-span-7 flex flex-col gap-4">
          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200/80">
            <h3 class="font-bold text-slate-800 text-sm mb-3 flex items-center justify-between">
              <span>✅ 오늘 할 일 (To-Do)</span>
              <span id="todo-stats" class="text-xs font-normal text-slate-500">0/0 완료</span>
            </h3>
            <div class="flex gap-2 mb-3">
              <input type="text" id="new-todo-input" placeholder="할 일 추가..." onkeypress="if(event.key==='Enter') addTodo()" class="flex-1 text-sm bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <button onclick="addTodo()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition">추가</button>
            </div>
            <ul id="todo-list" class="space-y-2 max-h-[220px] overflow-y-auto pr-1"></ul>
          </div>

          <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200/80">
            <h3 class="font-bold text-slate-800 text-sm mb-2">📝 메모</h3>
            <textarea id="daily-memo" oninput="saveDailyMemo()" rows="6" placeholder="공부 일지, 피드백, 메모 작성..." class="w-full text-sm p-3 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>
          </div>
        </div>
      </div>
    </section>

    <!-- WEEKLY VIEW -->
    <section id="view-weekly" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200/80 flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold text-slate-600">주간 기준일:</span>
          <input type="date" id="weekly-date" onchange="loadWeeklyView()" class="bg-slate-100 font-bold text-slate-800 px-3 py-1.5 rounded-lg border border-slate-300 text-sm">
        </div>
        <span class="text-xs text-slate-500 font-medium">👉 모바일에서는 옆으로 슬라이드해서 7일을 확인해보세요</span>
      </div>

      <!-- Scrollable Weekly Card Strip for Mobile, Grid for Desktop -->
      <div class="flex lg:grid lg:grid-cols-7 gap-3 overflow-x-auto pb-4 pt-1 hide-scrollbar">
        <template id="weekly-day-template">
          <div class="day-card min-w-[280px] lg:min-w-0 bg-white rounded-xl shadow-sm border border-slate-200/80 p-3 flex flex-col h-[560px]">
            <div class="flex items-center justify-between border-b pb-2 mb-2">
              <div class="day-title font-bold text-sm text-slate-800">월 (10/19)</div>
              <button class="go-daily-btn text-[11px] bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold px-2 py-1 rounded-md transition">일간보기 ➔</button>
            </div>
            <div class="mb-2">
              <label class="text-xs font-bold text-indigo-600 block mb-1">🎯 요일 목표</label>
              <textarea class="weekly-target w-full text-xs p-2 bg-indigo-50/50 border border-indigo-100 rounded-lg focus:outline-none focus:bg-white resize-none" rows="2" placeholder="목표 입력..."></textarea>
            </div>
            <div class="flex-1 flex flex-col overflow-hidden">
              <label class="text-xs font-bold text-slate-600 block mb-1">📝 요일 할 일 / 공부 계획</label>
              <textarea class="weekly-notes w-full flex-1 text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:bg-white resize-none leading-relaxed" placeholder="- 국어 문제집 2회차&#10;- 수학 인강 시청&#10;- 영단어 암기"></textarea>
            </div>
          </div>
        </template>
        <div id="weekly-grid-container" class="contents"></div>
      </div>
    </section>

    <!-- MONTHLY VIEW (EXAM) -->
    <section id="view-monthly" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200/80 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <input type="month" id="monthly-picker" onchange="loadMonthlyView()" class="bg-slate-100 font-bold text-slate-800 px-3 py-1.5 rounded-lg border border-slate-300 text-sm">
        </div>
        <span class="text-xs font-semibold text-rose-500 bg-rose-50 px-2.5 py-1 rounded-full border border-rose-100">🚩 시험기간 과목 플래너</span>
      </div>

      <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200/80 overflow-x-auto">
        <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs text-slate-500 mb-2 min-w-[600px]">
          <div class="text-rose-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-indigo-600">토</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1 min-w-[600px]"></div>
      </div>
    </section>

    <!-- SUBJECTS & TIMER -->
    <section id="view-subjects" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200/80">
        <h3 class="font-bold text-slate-800 text-sm mb-3">📚 과목 추가 및 관리</h3>
        <div class="flex gap-2 mb-4">
          <input type="text" id="new-subject-name" placeholder="과목명 (예: 수학 II)" class="flex-1 text-sm bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 focus:outline-none">
          <input type="color" id="new-subject-color" value="#4f46e5" class="w-10 h-9 p-0.5 border border-slate-300 rounded-lg cursor-pointer">
          <button onclick="addSubject()" class="bg-indigo-600 text-white text-sm font-medium px-4 py-1.5 rounded-lg">추가</button>
        </div>
        <div id="subjects-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3"></div>
      </div>
    </section>

  </main>

  <!-- Modal for Monthly Day Detail -->
  <div id="exam-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h4 id="modal-date-title" class="font-bold text-slate-800">2026-10-20 공부할 과목</h4>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500 mb-1 block">과목/시험 일정 추가</label>
        <div class="flex gap-2">
          <input type="text" id="modal-subject-input" placeholder="예: 국어 중간고사" class="flex-1 text-sm border border-slate-300 rounded-lg px-3 py-1.5 focus:outline-none">
          <button onclick="addExamSubject()" class="bg-rose-500 text-white text-sm px-3 py-1.5 rounded-lg font-medium">추가</button>
        </div>
      </div>
      <ul id="modal-subject-list" class="space-y-1.5 max-h-48 overflow-y-auto"></ul>
      <button onclick="closeModal()" class="w-full py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-lg text-sm">닫기</button>
    </div>
  </div>

  <script>
    const HOURS = ["06:00","07:00","08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00","23:00","00:00"];
    const WEEKDAYS = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
    let store = JSON.parse(localStorage.getItem('study_planner_db') || '{"daily":{},"weekly":{},"monthly":{},"routines":{},"subjects":[]}');

    function saveStore() { localStorage.setItem('study_planner_db', JSON.stringify(store)); }

    function switchTab(tab) {
      ['daily','weekly','monthly','subjects'].forEach(t => {
        document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
        const btn = document.getElementById(`tab-${t}`);
        if(t === tab) {
          btn.className = "flex-1 py-3 text-center font-semibold border-b-2 border-indigo-400 text-indigo-400 transition";
        } else {
          btn.className = "flex-1 py-3 text-center font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition";
        }
      });
      if(tab === 'weekly') loadWeeklyView();
      if(tab === 'monthly') loadMonthlyView();
      if(tab === 'subjects') renderSubjects();
    }

    // --- DAILY LOGIC ---
    function initDaily() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('daily-date').value = today;
      loadDailyView();
    }

    function loadDailyView() {
      const date = document.getElementById('daily-date').value;
      const d = new Date(date + 'T00:00:00');
      const dayIdx = d.getDay();
      document.getElementById('daily-day-name').innerText = WEEKDAYS[dayIdx];

      store.daily[date] = store.daily[date] || { todos: [], memo: "", timeTable: {} };
      const data = store.daily[date];

      // Sync Daily Target with Weekly Day Target
      const mondayStr = getMondayDate(date);
      store.weekly[mondayStr] = store.weekly[mondayStr] || {};
      document.getElementById('daily-target').value = store.weekly[mondayStr][`target_${dayIdx}`] || "";

      // Timetable rendering with Routine Support
      const ttContainer = document.getElementById('timetable-list');
      ttContainer.innerHTML = '';
      HOURS.forEach(h => {
        const key = `h_${h}`;
        const savedVal = data.timeTable[key] || "";
        const routineVal = (store.routines[dayIdx] && store.routines[dayIdx][key]) || "";
        const displayVal = savedVal || routineVal;
        const isRoutine = !savedVal && !!routineVal;

        const div = document.createElement('div');
        div.className = "flex items-center gap-2 text-xs";
        div.innerHTML = `
          <span class="w-11 font-semibold text-slate-400">${h}</span>
          <input type="text" value="${displayVal}" placeholder="일정 입력..." 
            onchange="saveTimeSlot('${date}', '${key}', this.value)"
            class="flex-1 bg-slate-50 border border-slate-200 rounded px-2 py-1 focus:bg-white focus:outline-none ${isRoutine ? 'text-indigo-600 italic font-medium' : ''}">
          <label class="flex items-center gap-0.5 text-[10px] text-slate-400 cursor-pointer shrink-0">
            <input type="checkbox" ${routineVal ? 'checked' : ''} onchange="toggleRoutine(${dayIdx}, '${key}', this)" class="rounded text-indigo-600"> 반복
          </label>
        `;
        ttContainer.appendChild(div);
      });

      renderTodos();
      document.getElementById('daily-memo').value = data.memo || "";
    }

    function saveDailyTarget() {
      const date = document.getElementById('daily-date').value;
      const dayIdx = new Date(date + 'T00:00:00').getDay();
      const mondayStr = getMondayDate(date);
      store.weekly[mondayStr] = store.weekly[mondayStr] || {};
      store.weekly[mondayStr][`target_${dayIdx}`] = document.getElementById('daily-target').value;
      saveStore();
    }

    function saveTimeSlot(date, key, val) {
      store.daily[date].timeTable[key] = val;
      saveStore();
    }

    function toggleRoutine(dayIdx, key, chk) {
      store.routines[dayIdx] = store.routines[dayIdx] || {};
      if(chk.checked) {
        const date = document.getElementById('daily-date').value;
        store.routines[dayIdx][key] = store.daily[date].timeTable[key] || "반복 일정";
      } else {
        delete store.routines[dayIdx][key];
      }
      saveStore();
      loadDailyView();
    }

    function addTodo() {
      const input = document.getElementById('new-todo-input');
      if(!input.value.trim()) return;
      const date = document.getElementById('daily-date').value;
      store.daily[date].todos.push({ text: input.value.trim(), done: false });
      input.value = '';
      saveStore();
      renderTodos();
    }

    function renderTodos() {
      const date = document.getElementById('daily-date').value;
      const todos = store.daily[date].todos || [];
      const list = document.getElementById('todo-list');
      list.innerHTML = '';
      let doneCount = 0;

      todos.forEach((t, i) => {
        if(t.done) doneCount++;
        const li = document.createElement('li');
        li.className = "flex items-center justify-between bg-slate-50 p-2 rounded-lg text-xs border border-slate-200/60";
        li.innerHTML = `
          <label class="flex items-center gap-2 cursor-pointer flex-1">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo(${i})" class="rounded text-indigo-600">
            <span class="${t.done ? 'line-through text-slate-400' : 'text-slate-700'}">${t.text}</span>
          </label>
          <button onclick="deleteTodo(${i})" class="text-slate-400 hover:text-rose-500">✕</button>
        `;
        list.appendChild(li);
      });
      document.getElementById('todo-stats').innerText = `${doneCount}/${todos.length} 완료`;
    }

    function toggleTodo(i) {
      const date = document.getElementById('daily-date').value;
      store.daily[date].todos[i].done = !store.daily[date].todos[i].done;
      saveStore();
      renderTodos();
    }

    function deleteTodo(i) {
      const date = document.getElementById('daily-date').value;
      store.daily[date].todos.splice(i, 1);
      saveStore();
      renderTodos();
    }

    function saveDailyMemo() {
      const date = document.getElementById('daily-date').value;
      store.daily[date].memo = document.getElementById('daily-memo').value;
      saveStore();
    }

    // --- WEEKLY LOGIC ---
    function getMondayDate(dStr) {
      const d = new Date(dStr + 'T00:00:00');
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff)).toISOString().split('T')[0];
    }

    function loadWeeklyView() {
      let dateVal = document.getElementById('weekly-date').value;
      if(!dateVal) {
        dateVal = new Date().toISOString().split('T')[0];
        document.getElementById('weekly-date').value = dateVal;
      }
      const mondayStr = getMondayDate(dateVal);
      store.weekly[mondayStr] = store.weekly[mondayStr] || {};
      const wData = store.weekly[mondayStr];

      const container = document.getElementById('weekly-grid-container');
      container.innerHTML = '';
      const template = document.getElementById('weekly-day-template');

      const dayNames = ["월","화","수","목","금","토","일"];
      for(let i=0; i<7; i++) {
        const curr = new Date(mondayStr + 'T00:00:00');
        curr.setDate(curr.getDate() + i);
        const currStr = curr.toISOString().split('T')[0];
        const dayIdx = curr.getDay();

        const clone = template.content.cloneNode(true);
        clone.querySelector('.day-title').innerText = `${dayNames[i]} (${curr.getMonth()+1}/${curr.getDate()})`;
        
        const targetTA = clone.querySelector('.weekly-target');
        targetTA.value = wData[`target_${dayIdx}`] || "";
        targetTA.oninput = (e) => { wData[`target_${dayIdx}`] = e.target.value; saveStore(); };

        const notesTA = clone.querySelector('.weekly-notes');
        notesTA.value = wData[`notes_${dayIdx}`] || "";
        notesTA.oninput = (e) => { wData[`notes_${dayIdx}`] = e.target.value; saveStore(); };

        clone.querySelector('.go-daily-btn').onclick = () => {
          document.getElementById('daily-date').value = currStr;
          switchTab('daily');
          loadDailyView();
        };

        container.appendChild(clone);
      }
    }

    // --- MONTHLY LOGIC ---
    let selectedModalDate = "";
    function loadMonthlyView() {
      let monthVal = document.getElementById('monthly-picker').value;
      if(!monthVal) {
        monthVal = new Date().toISOString().slice(0, 7);
        document.getElementById('monthly-picker').value = monthVal;
      }

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const [year, month] = monthVal.split('-').map(Number);
      const firstDay = new Date(year, month - 1, 1).getDay();
      const lastDate = new Date(year, month, 0).getDate();

      for(let i=0; i<firstDay; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for(let date=1; date<=lastDate; date++) {
        const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(date).padStart(2,'0')}`;
        const cell = document.createElement('div');
        cell.className = "bg-white border border-slate-200 rounded-lg p-1.5 min-h-[90px] flex flex-col justify-between hover:border-indigo-400 cursor-pointer transition";
        cell.onclick = () => openModal(dateStr);

        const top = document.createElement('div');
        top.className = "font-bold text-xs text-slate-700";
        top.innerText = date;
        cell.appendChild(top);

        const list = document.createElement('div');
        list.className = "space-y-1 my-1 flex-1 overflow-hidden";
        const subjects = store.monthly[dateStr] || [];
        subjects.slice(0,3).forEach(s => {
          const badge = document.createElement('div');
          badge.className = "text-[10px] bg-rose-50 text-rose-600 font-medium px-1 rounded truncate border border-rose-100";
          badge.innerText = s;
          list.appendChild(badge);
        });
        if(subjects.length > 3) {
          const more = document.createElement('div');
          more.className = "text-[9px] text-slate-400";
          more.innerText = `+${subjects.length - 3}개`;
          list.appendChild(more);
        }
        cell.appendChild(list);
        grid.appendChild(cell);
      }
    }

    function openModal(dateStr) {
      selectedModalDate = dateStr;
      document.getElementById('modal-date-title').innerText = `${dateStr} 시험 공부 과목`;
      document.getElementById('exam-modal').classList.remove('hidden');
      renderModalSubjects();
    }

    function closeModal() { document.getElementById('exam-modal').classList.add('hidden'); }

    function addExamSubject() {
      const input = document.getElementById('modal-subject-input');
      if(!input.value.trim()) return;
      store.monthly[selectedModalDate] = store.monthly[selectedModalDate] || [];
      store.monthly[selectedModalDate].push(input.value.trim());
      input.value = '';
      saveStore();
      renderModalSubjects();
      loadMonthlyView();
    }

    function renderModalSubjects() {
      const list = document.getElementById('modal-subject-list');
      list.innerHTML = '';
      const subjects = store.monthly[selectedModalDate] || [];
      subjects.forEach((s, idx) => {
        const li = document.createElement('li');
        li.className = "flex items-center justify-between bg-slate-50 p-2 rounded text-xs border border-slate-200";
        li.innerHTML = `<span>${s}</span><button onclick="deleteExamSubject(${idx})" class="text-rose-500 font-bold">✕</button>`;
        list.appendChild(li);
      });
    }

    function deleteExamSubject(idx) {
      store.monthly[selectedModalDate].splice(idx, 1);
      saveStore();
      renderModalSubjects();
      loadMonthlyView();
    }

    // --- SUBJECTS LOGIC ---
    function addSubject() {
      const name = document.getElementById('new-subject-name').value.trim();
      const color = document.getElementById('new-subject-color').value;
      if(!name) return;
      store.subjects.push({ id: Date.now(), name, color });
      document.getElementById('new-subject-name').value = '';
      saveStore();
      renderSubjects();
    }

    function renderSubjects() {
      const container = document.getElementById('subjects-list');
      container.innerHTML = '';
      store.subjects.forEach(sub => {
        const card = document.createElement('div');
        card.className = "bg-white p-3 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between";
        card.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full" style="background-color:${sub.color}"></span>
            <span class="font-bold text-sm text-slate-800">${sub.name}</span>
          </div>
          <button onclick="deleteSubject(${sub.id})" class="text-xs text-slate-400 hover:text-rose-500">삭제</button>
        `;
        container.appendChild(card);
      });
    }

    function deleteSubject(id) {
      store.subjects = store.subjects.filter(s => s.id !== id);
      saveStore();
      renderSubjects();
    }

    window.onload = () => { initDaily(); };
  </script>
</body>
</html>
