<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스터디 플래너</title>
  <link rel="manifest" href="data:application/manifest+json,&#123;%22name%22:%22스터디%20플래너%22,%22short_name%22:%22플래너%22,%22start_url%22:%22./%22,%22display%22:%22standalone%22,%22background_color%22:%22%23f8fafc%22,%22theme_color%22:%22%231e293b%22&#125;">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-indigo-100">

  <!-- Mobile Top Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
    <div class="px-4 h-12 flex items-center justify-between">
      <h1 class="font-bold text-base tracking-tight flex items-center gap-1.5">
        <span>📚</span> 스터디 플래너
      </h1>
      <span class="text-[10px] text-slate-400 font-medium">Mobile App</span>
    </div>

    <!-- Navigation Tabs -->
    <nav class="flex border-t border-slate-800 bg-slate-900 text-xs">
      <button onclick="switchTab('daily')" id="tab-daily" class="flex-1 py-2.5 text-center font-bold border-b-2 border-indigo-400 text-indigo-400 transition">일간</button>
      <button onclick="switchTab('weekly')" id="tab-weekly" class="flex-1 py-2.5 text-center font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition">주간</button>
      <button onclick="switchTab('monthly')" id="tab-monthly" class="flex-1 py-2.5 text-center font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition">월간(시험)</button>
      <button onclick="switchTab('subjects')" id="tab-subjects" class="flex-1 py-2.5 text-center font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition">과목/타이머</button>
    </nav>
  </header>

  <!-- Main View Container -->
  <main class="flex-1 max-w-md w-full mx-auto p-3 pb-16 overflow-y-auto">

    <!-- DAILY VIEW -->
    <section id="view-daily" class="space-y-3">
      <!-- Date & Goal Header -->
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200/80 space-y-2">
        <div class="flex items-center justify-between">
          <input type="date" id="daily-date" onchange="loadDailyView()" class="bg-slate-100 font-bold text-slate-800 px-2.5 py-1 rounded-lg border border-slate-300 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <span id="daily-day-name" class="font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded text-xs border border-indigo-100"></span>
        </div>
        <div class="flex items-center gap-2 pt-1 border-t border-slate-100">
          <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded shrink-0">🎯 목표</span>
          <input type="text" id="daily-target" placeholder="오늘 이룰 핵심 목표..." oninput="saveDailyTarget()" class="w-full text-xs font-medium border-b border-slate-200 focus:border-indigo-500 focus:outline-none py-0.5 bg-transparent">
        </div>
      </div>

      <!-- Add Custom Time Block -->
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200/80 space-y-2">
        <h3 class="font-bold text-slate-800 text-xs flex items-center justify-between">
          <span>🕒 시간표 범위 등록</span>
          <span class="text-[10px] text-slate-400">맞춤 시간대 설정</span>
        </h3>
        <div class="grid grid-cols-2 gap-2">
          <div class="flex items-center gap-1">
            <span class="text-[10px] text-slate-400 shrink-0">시작</span>
            <input type="time" id="ts-start" value="09:00" class="w-full bg-slate-50 border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none">
          </div>
          <div class="flex items-center gap-1">
            <span class="text-[10px] text-slate-400 shrink-0">종료</span>
            <input type="time" id="ts-end" value="11:00" class="w-full bg-slate-50 border border-slate-300 rounded px-1.5 py-1 text-xs focus:outline-none">
          </div>
        </div>
        <div class="flex gap-2">
          <input type="text" id="ts-text" placeholder="할 일/공부 내용 (예: 수학 인강)" class="flex-1 bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs focus:outline-none">
          <button onclick="addTimeBlock()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shrink-0 transition">등록</button>
        </div>
        <label class="flex items-center gap-1 text-[11px] text-slate-500 cursor-pointer pt-0.5">
          <input type="checkbox" id="ts-routine" class="rounded text-indigo-600">
          <span>매주 이 요일에 자동 반복 등록</span>
        </label>
      </div>

      <!-- Time Schedule List -->
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200/80">
        <h4 class="font-bold text-slate-700 text-xs mb-2">📋오늘의 시간표 목록</h4>
        <div id="timeblock-list" class="space-y-1.5 max-h-52 overflow-y-auto pr-1"></div>
      </div>

      <!-- To-Do List -->
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200/80">
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-bold text-slate-800 text-xs">✅ 오늘 할 일 (To-Do)</h3>
          <span id="todo-stats" class="text-[10px] text-slate-400">0/0 완료</span>
        </div>
        <div class="flex gap-1.5 mb-2">
          <input type="text" id="new-todo-input" placeholder="할 일 입력..." onkeypress="if(event.key==='Enter') addTodo()" class="flex-1 text-xs bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none">
          <button onclick="addTodo()" class="bg-slate-800 text-white text-xs font-medium px-3 py-1.5 rounded-lg shrink-0">추가</button>
        </div>
        <ul id="todo-list" class="space-y-1.5 max-h-36 overflow-y-auto pr-1"></ul>
      </div>

      <!-- Memo -->
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200/80">
        <h3 class="font-bold text-slate-800 text-xs mb-1.5">📝 간단 메모</h3>
        <textarea id="daily-memo" oninput="saveDailyMemo()" rows="3" placeholder="공부 피드백, 메모..." class="w-full text-xs p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none resize-none"></textarea>
      </div>
    </section>

    <!-- WEEKLY VIEW -->
    <section id="view-weekly" class="hidden space-y-3">
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200/80 flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <span class="text-xs font-semibold text-slate-600">기준일:</span>
          <input type="date" id="weekly-date" onchange="loadWeeklyView()" class="bg-slate-100 font-bold text-slate-800 px-2 py-1 rounded-lg border border-slate-300 text-xs">
        </div>
        <span class="text-[10px] text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded font-bold">👉 옆으로 슬라이드</span>
      </div>

      <!-- Mobile Horizontal Scroll Container -->
      <div class="flex gap-2.5 overflow-x-auto pb-2 hide-scrollbar">
        <template id="weekly-day-template">
          <div class="day-card min-w-[260px] bg-white rounded-xl shadow-sm border border-slate-200/80 p-3 flex flex-col h-[460px]">
            <div class="flex items-center justify-between border-b pb-1.5 mb-2">
              <div class="day-title font-bold text-xs text-slate-800">월 (10/19)</div>
              <button class="go-daily-btn text-[10px] bg-indigo-50 text-indigo-600 font-bold px-2 py-0.5 rounded">일간보기 ➔</button>
            </div>
            <div class="mb-2">
              <label class="text-[10px] font-bold text-indigo-600 block mb-0.5">🎯 요일 목표</label>
              <textarea class="weekly-target w-full text-xs p-1.5 bg-indigo-50/50 border border-indigo-100 rounded focus:outline-none resize-none" rows="2" placeholder="목표 입력..."></textarea>
            </div>
            <div class="flex-1 flex flex-col overflow-hidden">
              <label class="text-[10px] font-bold text-slate-600 block mb-0.5">📝 요일 공부 계획</label>
              <textarea class="weekly-notes w-full flex-1 text-xs p-2 bg-slate-50 border border-slate-200 rounded focus:outline-none resize-none leading-relaxed" placeholder="- 계획 작성..."></textarea>
            </div>
          </div>
        </template>
        <div id="weekly-grid-container" class="contents"></div>
      </div>
    </section>

    <!-- MONTHLY VIEW (EXAM) -->
    <section id="view-monthly" class="hidden space-y-3">
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200/80 flex items-center justify-between">
        <input type="month" id="monthly-picker" onchange="loadMonthlyView()" class="bg-slate-100 font-bold text-slate-800 px-2.5 py-1 rounded-lg border border-slate-300 text-xs">
        <span class="text-[10px] font-bold text-rose-500 bg-rose-50 px-2 py-0.5 rounded border border-rose-100">🚩 시험기간 플래너</span>
      </div>

      <div class="bg-white p-2 rounded-xl shadow-sm border border-slate-200/80">
        <div class="grid grid-cols-7 gap-1 text-center font-bold text-[11px] text-slate-500 mb-1">
          <div class="text-rose-500">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="text-indigo-600">토</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
      </div>
    </section>

    <!-- SUBJECTS & TIMER -->
    <section id="view-subjects" class="hidden space-y-3">
      <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200/80">
        <h3 class="font-bold text-slate-800 text-xs mb-2">📚 과목 추가</h3>
        <div class="flex gap-1.5 mb-3">
          <input type="text" id="new-subject-name" placeholder="과목명 (예: 수학 II)" class="flex-1 text-xs bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none">
          <input type="color" id="new-subject-color" value="#4f46e5" class="w-8 h-8 p-0.5 border border-slate-300 rounded-lg cursor-pointer">
          <button onclick="addSubject()" class="bg-indigo-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg">추가</button>
        </div>
        <div id="subjects-list" class="space-y-2"></div>
      </div>
    </section>

  </main>

  <!-- Modal for Monthly Day Detail -->
  <div id="exam-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-xs w-full p-4 shadow-xl space-y-3">
      <div class="flex justify-between items-center border-b pb-1.5">
        <h4 id="modal-date-title" class="font-bold text-xs text-slate-800">2026-10-20 공부할 과목</h4>
        <button onclick="closeModal()" class="text-slate-400 font-bold text-xs">✕</button>
      </div>
      <div>
        <div class="flex gap-1.5">
          <input type="text" id="modal-subject-input" placeholder="예: 국어 중간고사" class="flex-1 text-xs border border-slate-300 rounded-lg px-2.5 py-1.5 focus:outline-none">
          <button onclick="addExamSubject()" class="bg-rose-500 text-white text-xs px-2.5 py-1.5 rounded-lg font-bold">추가</button>
        </div>
      </div>
      <ul id="modal-subject-list" class="space-y-1 max-h-36 overflow-y-auto"></ul>
      <button onclick="closeModal()" class="w-full py-1.5 bg-slate-100 text-slate-700 font-bold rounded-lg text-xs">닫기</button>
    </div>
  </div>

  <script>
    const WEEKDAYS = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
    let store = JSON.parse(localStorage.getItem('study_planner_db') || '{"daily":{},"weekly":{},"monthly":{},"routines":{},"subjects":[]}');

    function saveStore() { localStorage.setItem('study_planner_db', JSON.stringify(store)); }

    function switchTab(tab) {
      ['daily','weekly','monthly','subjects'].forEach(t => {
        document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
        const btn = document.getElementById(`tab-${t}`);
        if(t === tab) {
          btn.className = "flex-1 py-2.5 text-center font-bold border-b-2 border-indigo-400 text-indigo-400 transition";
        } else {
          btn.className = "flex-1 py-2.5 text-center font-medium text-slate-400 hover:text-slate-200 border-b-2 border-transparent transition";
        }
      });
      if(tab === 'weekly') loadWeeklyView();
      if(tab === 'monthly') loadMonthlyView();
      if(tab === 'subjects') renderSubjects();
    }

    // --- DAILY LOGIC ---
    function initDaily() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('daily-date').value = today;
      loadDailyView();
    }

    function loadDailyView() {
      const date = document.getElementById('daily-date').value;
      const d = new Date(date + 'T00:00:00');
      const dayIdx = d.getDay();
      document.getElementById('daily-day-name').innerText = WEEKDAYS[dayIdx];

      store.daily[date] = store.daily[date] || { todos: [], memo: "", blocks: [] };
      const data = store.daily[date];

      // Sync Daily Target with Weekly Day Target
      const mondayStr = getMondayDate(date);
      store.weekly[mondayStr] = store.weekly[mondayStr] || {};
      document.getElementById('daily-target').value = store.weekly[mondayStr][`target_${dayIdx}`] || "";

      renderTimeBlocks();
      renderTodos();
      document.getElementById('daily-memo').value = data.memo || "";
    }

    function saveDailyTarget() {
      const date = document.getElementById('daily-date').value;
      const dayIdx = new Date(date + 'T00:00:00').getDay();
      const mondayStr = getMondayDate(date);
      store.weekly[mondayStr] = store.weekly[mondayStr] || {};
      store.weekly[mondayStr][`target_${dayIdx}`] = document.getElementById('daily-target').value;
      saveStore();
    }

    function addTimeBlock() {
      const start = document.getElementById('ts-start').value;
      const end = document.getElementById('ts-end').value;
      const text = document.getElementById('ts-text').value.trim();
      const isRoutine = document.getElementById('ts-routine').checked;

      if(!text) return;

      const date = document.getElementById('daily-date').value;
      const dayIdx = new Date(date + 'T00:00:00').getDay();

      const newBlock = { id: Date.now(), start, end, text, isRoutine };
      store.daily[date].blocks.push(newBlock);

      if(isRoutine) {
        store.routines[dayIdx] = store.routines[dayIdx] || [];
        store.routines[dayIdx].push(newBlock);
      }

      document.getElementById('ts-text').value = '';
      document.getElementById('ts-routine').checked = false;
      saveStore();
      renderTimeBlocks();
    }

    function renderTimeBlocks() {
      const date = document.getElementById('daily-date').value;
      const dayIdx = new Date(date + 'T00:00:00').getDay();

      const userBlocks = store.daily[date].blocks || [];
      const routineBlocks = store.routines[dayIdx] || [];

      // Combine blocks and sort by start time
      const allBlocks = [...userBlocks];
      routineBlocks.forEach(rb => {
        if(!allBlocks.some(b => b.id === rb.id)) {
          allBlocks.push({...rb, fromRoutine: true});
        }
      });

      allBlocks.sort((a,b) => a.start.localeCompare(b.start));

      const list = document.getElementById('timeblock-list');
      list.innerHTML = '';

      if(allBlocks.length === 0) {
        list.innerHTML = `<p class="text-[11px] text-slate-400 py-2 text-center">등록된 시간표가 없습니다.</p>`;
        return;
      }

      allBlocks.forEach(b => {
        const div = document.createElement('div');
        div.className = `flex items-center justify-between p-2 rounded-lg text-xs border ${b.fromRoutine ? 'bg-indigo-50/50 border-indigo-100 text-indigo-900' : 'bg-slate-50 border-slate-200 text-slate-800'}`;
        div.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="font-bold text-[11px] text-indigo-600 bg-white px-1.5 py-0.5 rounded border border-slate-200">${b.start} ~ ${b.end}</span>
            <span class="font-medium">${b.text}</span>
            ${b.fromRoutine || b.isRoutine ? '<span class="text-[9px] text-indigo-500 bg-indigo-100 px-1 rounded">🔁반복</span>' : ''}
          </div>
          <button onclick="deleteTimeBlock(${b.id}, ${b.fromRoutine})" class="text-slate-400 hover:text-rose-500 font-bold">✕</button>
        `;
        list.appendChild(div);
      });
    }

    function deleteTimeBlock(id, fromRoutine) {
      const date = document.getElementById('daily-date').value;
      const dayIdx = new Date(date + 'T00:00:00').getDay();

      store.daily[date].blocks = (store.daily[date].blocks || []).filter(b => b.id !== id);
      if(fromRoutine && store.routines[dayIdx]) {
        store.routines[dayIdx] = store.routines[dayIdx].filter(b => b.id !== id);
      }
      saveStore();
      renderTimeBlocks();
    }

    function addTodo() {
      const input = document.getElementById('new-todo-input');
      if(!input.value.trim()) return;
      const date = document.getElementById('daily-date').value;
      store.daily[date].todos.push({ text: input.value.trim(), done: false });
      input.value = '';
      saveStore();
      renderTodos();
    }

    function renderTodos() {
      const date = document.getElementById('daily-date').value;
      const todos = store.daily[date].todos || [];
      const list = document.getElementById('todo-list');
      list.innerHTML = '';
      let doneCount = 0;

      todos.forEach((t, i) => {
        if(t.done) doneCount++;
        const li = document.createElement('li');
        li.className = "flex items-center justify-between bg-slate-50 p-1.5 rounded-lg text-xs border border-slate-200/60";
        li.innerHTML = `
          <label class="flex items-center gap-2 cursor-pointer flex-1">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodo(${i})" class="rounded text-indigo-600">
            <span class="${t.done ? 'line-through text-slate-400' : 'text-slate-700'}">${t.text}</span>
          </label>
          <button onclick="deleteTodo(${i})" class="text-slate-400 hover:text-rose-500 px-1">✕</button>
        `;
        list.appendChild(li);
      });
      document.getElementById('todo-stats').innerText = `${doneCount}/${todos.length} 완료`;
    }

    function toggleTodo(i) {
      const date = document.getElementById('daily-date').value;
      store.daily[date].todos[i].done = !store.daily[date].todos[i].done;
      saveStore();
      renderTodos();
    }

    function deleteTodo(i) {
      const date = document.getElementById('daily-date').value;
      store.daily[date].todos.splice(i, 1);
      saveStore();
      renderTodos();
    }

    function saveDailyMemo() {
      const date = document.getElementById('daily-date').value;
      store.daily[date].memo = document.getElementById('daily-memo').value;
      saveStore();
    }

    // --- WEEKLY LOGIC ---
    function getMondayDate(dStr) {
      const d = new Date(dStr + 'T00:00:00');
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff)).toISOString().split('T')[0];
    }

    function loadWeeklyView() {
      let dateVal = document.getElementById('weekly-date').value;
      if(!dateVal) {
        dateVal = new Date().toISOString().split('T')[0];
        document.getElementById('weekly-date').value = dateVal;
      }
      const mondayStr = getMondayDate(dateVal);
      store.weekly[mondayStr] = store.weekly[mondayStr] || {};
      const wData = store.weekly[mondayStr];

      const container = document.getElementById('weekly-grid-container');
      container.innerHTML = '';
      const template = document.getElementById('weekly-day-template');

      const dayNames = ["월","화","수","목","금","토","일"];
      for(let i=0; i<7; i++) {
        const curr = new Date(mondayStr + 'T00:00:00');
        curr.setDate(curr.getDate() + i);
        const currStr = curr.toISOString().split('T')[0];
        const dayIdx = curr.getDay();

        const clone = template.content.cloneNode(true);
        clone.querySelector('.day-title').innerText = `${dayNames[i]} (${curr.getMonth()+1}/${curr.getDate()})`;
        
        const targetTA = clone.querySelector('.weekly-target');
        targetTA.value = wData[`target_${dayIdx}`] || "";
        targetTA.oninput = (e) => { wData[`target_${dayIdx}`] = e.target.value; saveStore(); };

        const notesTA = clone.querySelector('.weekly-notes');
        notesTA.value = wData[`notes_${dayIdx}`] || "";
        notesTA.oninput = (e) => { wData[`notes_${dayIdx}`] = e.target.value; saveStore(); };

        clone.querySelector('.go-daily-btn').onclick = () => {
          document.getElementById('daily-date').value = currStr;
          switchTab('daily');
          loadDailyView();
        };

        container.appendChild(clone);
      }
    }

    // --- MONTHLY LOGIC ---
    let selectedModalDate = "";
    function loadMonthlyView() {
      let monthVal = document.getElementById('monthly-picker').value;
      if(!monthVal) {
        monthVal = new Date().toISOString().slice(0, 7);
        document.getElementById('monthly-picker').value = monthVal;
      }

      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';

      const [year, month] = monthVal.split('-').map(Number);
      const firstDay = new Date(year, month - 1, 1).getDay();
      const lastDate = new Date(year, month, 0).getDate();

      for(let i=0; i<firstDay; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for(let date=1; date<=lastDate; date++) {
        const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(date).padStart(2,'0')}`;
        const cell = document.createElement('div');
        cell.className = "bg-white border border-slate-200 rounded-lg p-1 h-16 flex flex-col justify-between hover:border-indigo-400 cursor-pointer transition";
        cell.onclick = () => openModal(dateStr);

        const top = document.createElement('div');
        top.className = "font-bold text-[10px] text-slate-700";
        top.innerText = date;
        cell.appendChild(top);

        const list = document.createElement('div');
        list.className = "space-y-0.5 my-0.5 flex-1 overflow-hidden";
        const subjects = store.monthly[dateStr] || [];
        subjects.slice(0,2).forEach(s => {
          const badge = document.createElement('div');
          badge.className = "text-[8px] bg-rose-50 text-rose-600 font-medium px-0.5 rounded truncate border border-rose-100";
          badge.innerText = s;
          list.appendChild(badge);
        });
        if(subjects.length > 2) {
          const more = document.createElement('div');
          more.className = "text-[7px] text-slate-400";
          more.innerText = `+${subjects.length - 2}개`;
          list.appendChild(more);
        }
        cell.appendChild(list);
        grid.appendChild(cell);
      }
    }

    function openModal(dateStr) {
      selectedModalDate = dateStr;
      document.getElementById('modal-date-title').innerText = `${dateStr} 시험 과목`;
      document.getElementById('exam-modal').classList.remove('hidden');
      renderModalSubjects();
    }

    function closeModal() { document.getElementById('exam-modal').classList.add('hidden'); }

    function addExamSubject() {
      const input = document.getElementById('modal-subject-input');
      if(!input.value.trim()) return;
      store.monthly[selectedModalDate] = store.monthly[selectedModalDate] || [];
      store.monthly[selectedModalDate].push(input.value.trim());
      input.value = '';
      saveStore();
      renderModalSubjects();
      loadMonthlyView();
    }

    function renderModalSubjects() {
      const list = document.getElementById('modal-subject-list');
      list.innerHTML = '';
      const subjects = store.monthly[selectedModalDate] || [];
      subjects.forEach((s, idx) => {
        const li = document.createElement('li');
        li.className = "flex items-center justify-between bg-slate-50 p-1.5 rounded text-xs border border-slate-200";
        li.innerHTML = `<span>${s}</span><button onclick="deleteExamSubject(${idx})" class="text-rose-500 font-bold">✕</button>`;
        list.appendChild(li);
      });
    }

    function deleteExamSubject(idx) {
      store.monthly[selectedModalDate].splice(idx, 1);
      saveStore();
      renderModalSubjects();
      loadMonthlyView();
    }

    // --- SUBJECTS LOGIC ---
    function addSubject() {
      const name = document.getElementById('new-subject-name').value.trim();
      const color = document.getElementById('new-subject-color').value;
      if(!name) return;
      store.subjects.push({ id: Date.now(), name, color });
      document.getElementById('new-subject-name').value = '';
      saveStore();
      renderSubjects();
    }

    function renderSubjects() {
      const container = document.getElementById('subjects-list');
      container.innerHTML = '';
      store.subjects.forEach(sub => {
        const card = document.createElement('div');
        card.className = "bg-white p-2.5 rounded-xl border border-slate-200/80 shadow-sm flex items-center justify-between";
        card.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full" style="background-color:${sub.color}"></span>
            <span class="font-bold text-xs text-slate-800">${sub.name}</span>
          </div>
          <button onclick="deleteSubject(${sub.id})" class="text-[11px] text-slate-400 hover:text-rose-500">삭제</button>
        `;
        container.appendChild(card);
      });
    }

    function deleteSubject(id) {
      store.subjects = store.subjects.filter(s => s.id !== id);
      saveStore();
      renderSubjects();
    }

    window.onload = () => { initDaily(); };
  </script>
</body>
</html>
